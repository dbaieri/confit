[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "confort"
version = "0.1.0"
description = "Dataclass configs, self-registering entrypoints and a tyro CLI: a comfortable fort for your project settings."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniele Baieri" }]
requires-python = ">=3.10"
dependencies = [
    "tyro>=0.9.24",
    "pyyaml>=6.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/confort"]

[tool.pytest.ini_options]
testpaths = ["tests"]
