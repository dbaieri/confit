<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 44 280 274" width="280" height="274" role="img" aria-labelledby="title desc">
  <title id="title">confort</title>
  <desc id="desc">A cosy stone tower with a warmly lit gear-shaped window between curly braces, above the word confort.</desc>
  <defs>
    <radialGradient id="warm" cx="0.5" cy="0.6" r="0.6">
      <stop offset="0" stop-color="#FFF4C2"/>
      <stop offset="1" stop-color="#F6B21B"/>
    </radialGradient>
    <radialGradient id="window-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD66B" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFD66B" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tower">
      <rect x="92" y="112" width="96" height="122"/>
    </clipPath>
  </defs>

  <!-- cream backdrop -->
  <rect x="0" y="44" width="280" height="274" rx="40" fill="#FBEBD0"/>

  <!-- grassy mound -->
  <ellipse cx="140" cy="236" rx="96" ry="14" fill="#7FAF5C" stroke="#3B2A1A" stroke-width="4"/>

  <!-- tower body with stonework -->
  <rect x="92" y="112" width="96" height="122" fill="#D9C4A0"/>
  <g clip-path="url(#tower)" stroke="#A8916C" stroke-width="2" fill="none">
    <path d="M92 132 H188 M92 152 H188 M92 172 H188 M92 192 H188 M92 212 H188"/>
    <!-- running bond: each row is offset by half a brick, so joints never line up -->
    <path d="M112 112 V132 M152 112 V132
             M132 132 V152 M172 132 V152
             M112 152 V172 M152 152 V172
             M132 172 V192 M172 172 V192
             M112 192 V212 M152 192 V212
             M132 212 V234 M172 212 V234"/>
  </g>
  <rect x="92" y="112" width="96" height="122" fill="none" stroke="#3B2A1A" stroke-width="4"/>

  <!-- battlements -->
  <rect x="84" y="100" width="112" height="16" fill="#CDB68F" stroke="#3B2A1A" stroke-width="4" stroke-linejoin="round"/>
  <g fill="#CDB68F" stroke="#3B2A1A" stroke-width="4" stroke-linejoin="round">
    <rect x="84" y="84" width="17" height="18"/>
    <rect x="108" y="84" width="17" height="18"/>
    <rect x="131.5" y="84" width="17" height="18"/>
    <rect x="155" y="84" width="17" height="18"/>
    <rect x="179" y="84" width="17" height="18"/>
  </g>

  <!-- warm window, the comfort inside -->
  <circle cx="140" cy="152" r="32" fill="url(#window-glow)"/>
  <!-- a glowing yellow cog -->
  <g transform="translate(140 152)">
    <!-- eight bold teeth, a thin ring and a wide hole -->
    <g fill="#F6B21B" stroke="#3B2A1A" stroke-width="2.5" stroke-linejoin="round">
      <polygon points="-5,-11 5,-11 3.8,-20.5 -3.8,-20.5"/>
      <polygon points="-5,-11 5,-11 3.8,-20.5 -3.8,-20.5" transform="rotate(45)"/>
      <polygon points="-5,-11 5,-11 3.8,-20.5 -3.8,-20.5" transform="rotate(90)"/>
      <polygon points="-5,-11 5,-11 3.8,-20.5 -3.8,-20.5" transform="rotate(135)"/>
      <polygon points="-5,-11 5,-11 3.8,-20.5 -3.8,-20.5" transform="rotate(180)"/>
      <polygon points="-5,-11 5,-11 3.8,-20.5 -3.8,-20.5" transform="rotate(225)"/>
      <polygon points="-5,-11 5,-11 3.8,-20.5 -3.8,-20.5" transform="rotate(270)"/>
      <polygon points="-5,-11 5,-11 3.8,-20.5 -3.8,-20.5" transform="rotate(315)"/>
    </g>
    <!-- ring with a real hole, so the brickwork shows through -->
    <path d="M-13 0 A 13 13 0 1 0 13 0 A 13 13 0 1 0 -13 0 Z M-7.5 0 A 7.5 7.5 0 1 0 7.5 0 A 7.5 7.5 0 1 0 -7.5 0 Z"
          fill="url(#warm)" fill-rule="evenodd" stroke="#3B2A1A" stroke-width="2.5"/>
  </g>

  <!-- curly braces carved around the window -->
  <g font-family="'JetBrains Mono','Fira Code',Menlo,Consolas,monospace" font-size="38" font-weight="700" fill="#3B2A1A" opacity="0.8">
    <text x="117" y="163" text-anchor="end">{</text>
    <text x="163" y="163" text-anchor="start">}</text>
  </g>

  <!-- door -->
  <path d="M126 234 V210 A 14 14 0 0 1 154 210 V234 Z" fill="#6B3F24" stroke="#3B2A1A" stroke-width="3.5" stroke-linejoin="round"/>
  <circle cx="148" cy="222" r="2" fill="#F2B23A"/>

  <!-- wordmark: "conf" as code, "ort" as stone -->
  <text x="140" y="298" text-anchor="middle" font-size="54" fill="#3B2A1A"><tspan font-family="'JetBrains Mono','Fira Code',Menlo,Consolas,monospace" font-weight="700">conf</tspan><tspan font-family="Georgia,'Times New Roman',serif" font-style="italic" fill="#B5432F">ort</tspan></text>
</svg>
