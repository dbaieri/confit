<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 28 280 352" width="280" height="352" role="img" aria-labelledby="title desc">
  <title id="title">confit</title>
  <desc id="desc">A preserving jar of golden fat slow-cooking a config gear in curly braces, with a sprig of rosemary and a bay leaf floating above it, over the word confit: "conf" in code type, "it" in kitchen serif.</desc>
  <defs>
    <linearGradient id="fat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F9C846"/>
      <stop offset="1" stop-color="#E08A1E"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.25" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="jar-inside">
      <rect x="78" y="92" width="164" height="166" rx="30"/>
    </clipPath>
  </defs>

  <!-- cream backdrop, keeps the mark readable on dark themes -->
  <rect x="20" y="28" width="280" height="352" rx="40" fill="#FBEBD0"/>

  <!-- jar body -->
  <rect x="70" y="84" width="180" height="182" rx="36" fill="#FFF8EC" stroke="#3B2A1A" stroke-width="6"/>

  <g clip-path="url(#jar-inside)">
    <!-- fat, with a wavy surface -->
    <path d="M70 140 C 100 128, 125 152, 160 140 S 220 128, 250 140 L 250 270 L 70 270 Z" fill="url(#fat)"/>

    <!-- glass highlight (under the herbs so they stay vivid) -->
    <rect x="78" y="92" width="164" height="166" rx="30" fill="url(#glass)"/>

    <!-- bubbles -->
    <circle cx="108" cy="246" r="4" fill="#FFF3C4" opacity="0.8"/>
    <circle cx="130" cy="252" r="3" fill="#FFF3C4" opacity="0.8"/>
    <circle cx="192" cy="250" r="4" fill="#FFF3C4" opacity="0.8"/>
    <circle cx="220" cy="240" r="3" fill="#FFF3C4" opacity="0.8"/>
    <circle cx="172" cy="160" r="3" fill="#FFF3C4" opacity="0.8"/>
  </g>

  <!-- rosemary sprig floating diagonally, above-left of the gear -->
  <g transform="translate(112 158) rotate(62) translate(0 -27)" stroke="#4E7A3A" stroke-linecap="round">
    <line x1="0" y1="0" x2="0" y2="54" stroke-width="3"/>
    <g stroke-width="3.5">
      <line x1="0" y1="9" x2="-7" y2="3"/><line x1="0" y1="9" x2="7" y2="3"/>
      <line x1="0" y1="18" x2="-7" y2="12"/><line x1="0" y1="18" x2="7" y2="12"/>
      <line x1="0" y1="27" x2="-7" y2="21"/><line x1="0" y1="27" x2="7" y2="21"/>
      <line x1="0" y1="36" x2="-7" y2="30"/><line x1="0" y1="36" x2="7" y2="30"/>
      <line x1="0" y1="2" x2="0" y2="-4"/>
    </g>
  </g>

  <!-- bay leaf floating diagonally, above-right of the gear -->
  <g transform="translate(214 152) rotate(-52) translate(0 -24)">
    <path d="M0 0 C 8 12, 8 36, 0 48 C -8 36, -8 12, 0 0 Z" fill="#6B8F3E" stroke="#3E5F2A" stroke-width="2"/>
    <path d="M0 5 L 0 54" stroke="#3E5F2A" stroke-width="2" stroke-linecap="round"/>
    <g stroke="#A9C77A" stroke-width="1.3" stroke-linecap="round" fill="none">
      <path d="M0 16 L 3.5 11"/><path d="M0 16 L -3.5 11"/>
      <path d="M0 26 L 4 21"/><path d="M0 26 L -4 21"/>
      <path d="M0 36 L 3.5 31"/><path d="M0 36 L -3.5 31"/>
    </g>
  </g>

  <!-- the config, slow-cooking: a gear -->
  <g transform="translate(160 206) scale(0.85)">
    <circle r="30" fill="none" stroke="#3B2A1A" stroke-width="13" stroke-dasharray="11.8 11.76"/>
    <circle r="25" fill="#3B2A1A"/>
    <circle r="10" fill="#F2B23A"/>
  </g>

  <!-- curly braces hugging the gear -->
  <text x="127" y="221" text-anchor="end" font-family="'JetBrains Mono','Fira Code',Menlo,Consolas,monospace" font-size="50" font-weight="700" fill="#3B2A1A" opacity="0.85">{</text>
  <text x="193" y="221" text-anchor="start" font-family="'JetBrains Mono','Fira Code',Menlo,Consolas,monospace" font-size="50" font-weight="700" fill="#3B2A1A" opacity="0.85">}</text>

  <!-- lid -->
  <rect x="62" y="56" width="196" height="34" rx="10" fill="#B5432F" stroke="#3B2A1A" stroke-width="6"/>
  <line x1="84" y1="66" x2="84" y2="80" stroke="#3B2A1A" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="236" y1="66" x2="236" y2="80" stroke="#3B2A1A" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- wordmark: "conf" as code, "it" as cuisine -->
  <text x="160" y="345" text-anchor="middle" font-size="58" fill="#3B2A1A"><tspan font-family="'JetBrains Mono','Fira Code',Menlo,Consolas,monospace" font-weight="700">conf</tspan><tspan font-family="Georgia,'Times New Roman',serif" font-style="italic" fill="#B5432F">it</tspan></text>
</svg>
